name: Feature Request
description: Suggest an improvement to github-profile-trophy
title: '[Feature]: '
labels: ['enhancement', 'triage']
assignees: ['nixrajput']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please check the [existing issues](https://github.com/nixrajput/github-profile-trophy/issues) first.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the limitation you hit, not just the feature you want.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
