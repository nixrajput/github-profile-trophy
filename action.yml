name: Generate GitHub Profile Trophy SVG
description: Run the local generator script to produce an SVG.
inputs:
  username:
    description: "GitHub username to generate the trophy for"
    required: true
  output_path:
    description: "Output path to write the SVG"
    required: true
    default: "trophy.svg"
  token:
    description: "PAT or token to use for GitHub API"
    required: true
  theme:
    description: "Theme for the card"
    required: false
    default: "default"
runs:
  using: "composite"
  steps:
    - name: Setup Deno
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version: v1.x

    - name: Generate trophy
      shell: bash
      env:
        GITHUB_TOKEN1: ${{ inputs.token }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_OUTPUT_PATH: ${{ inputs.output_path }}
        INPUT_THEME: ${{ inputs.theme }}
      run: |
        deno run --allow-net --allow-env --allow-read --allow-write "$GITHUB_ACTION_PATH/render_svg.ts" "$INPUT_USERNAME" "$INPUT_OUTPUT_PATH" "$INPUT_THEME"
