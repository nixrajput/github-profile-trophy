version: "3"
services:
  redis:
    container_name: trophy-redis
    image: redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    ports:
      - "6379:6379"
  deno-app:
    build: .
    volumes:
      - .:/app
    ports:
      - "80:8080"
    environment:
      - DENO_ENV=development
    command: ["deno", "run", "--watch", "-A", "main.ts"]
